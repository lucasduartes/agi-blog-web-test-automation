name: Agi Blog Web Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:

    name: Tests - ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15-intel

    runs-on: ${{ matrix.os }}

    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Display environment information
        run: |
          java --version
          mvn --version

      - name: Run web tests
        run: mvn -B -ntp clean test -Dheadless=true

      - name: Generate Allure report
        if: always()
        run: mvn -B -ntp allure:report

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results-${{ matrix.os }}
          path: target/allure-results
          if-no-files-found: warn

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-${{ matrix.os }}
          path: target/allure-report
          if-no-files-found: error